[project]
name = "openneuro-t1"
version = "0.1.0"
description = "Reproducible FSL preprocessing of public OpenNeuro T1-weighted MRI with NiWrap, Docker and Snakemake."
readme = "README.md"
authors = [
    { name = "Raihan Abdul Vaheed", email = "rvaheed14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "niwrap==1.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "snakemake>=9.15.0",
    "templateflow>=25.1.2",
]

[project.scripts]
openneuro-t1 = "openneuro_t1.run_subject:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
